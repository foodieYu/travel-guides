<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C4033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>輕遊福熊五日手冊</title>
<meta name="description" content="2026/11/10–11/14 熊本・高千穗・湯布院・福岡・柳川 五日行程手冊">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: fixed coffee header (title + 3 main tabs + context sub-row) → one view at a time → bottom-sheet modal */
:root{
  --milk:#B08E6B; --cream:#FDFBF7; --coffee:#5C4033; --caramel:#C8823C;
  --foam:#F3EADF; --line:#E6D9C8; --ink:#3B2A20; --ink-soft:#7A6555; --card:#FFFFFF;
  --shadow:0 6px 20px rgba(92,64,51,.10), 0 1px 3px rgba(92,64,51,.08);
  --f-display:"Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --hdr:150px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --gut-l:max(16px, env(safe-area-inset-left,0px)); --gut-r:max(16px, env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--coffee)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.65 var(--f-body);padding-top:var(--hdr);min-height:100vh;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ===== Fixed header ===== */
.hdr{position:fixed;inset:0 0 auto 0;z-index:50;background:var(--coffee);color:var(--cream);
  padding-top:var(--safe-t);padding-left:var(--gut-l);padding-right:var(--gut-r);box-shadow:0 4px 16px rgba(40,25,15,.25)}
.hdr-in{max-width:620px;margin:0 auto}
.hdr-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 2px 8px}
.hdr-title{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;margin:0}
.hdr-sub{font-size:12px;opacity:.75;letter-spacing:.06em;white-space:nowrap}
.main-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(253,251,247,.10);border-radius:16px;padding:4px;gap:4px}
.mt{border:0;background:transparent;color:var(--cream);border-radius:12px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:14px;letter-spacing:.04em;transition:background .25s,color .25s}
.mt svg{width:17px;height:17px;flex:none}
.mt[aria-selected="true"]{background:var(--cream);color:var(--coffee)}
.sub{padding:10px 0 12px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dt{border:0;background:rgba(253,251,247,.08);border-radius:12px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  min-height:44px;color:var(--cream);position:relative;transition:background .2s}
.dt b{font-family:var(--f-display);font-size:13.5px}
.dt small{font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.dt[aria-selected="true"]{background:var(--caramel);color:#fff}
.dt[aria-selected="true"] small{opacity:.95}
.today{position:absolute;top:-6px;right:-2px;background:var(--cream);color:var(--caramel);font-size:9px;font-weight:700;padding:0 5px;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:rgba(253,251,247,.08);color:var(--cream);border-radius:20px;padding:0 14px;min-height:36px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--caramel);color:#fff}
.sub-note{font-size:12.5px;opacity:.8;padding:2px 2px 0}
.mt:focus-visible,.dt:focus-visible,.chip:focus-visible,.card:focus-visible,.btn:focus-visible,.close:focus-visible,.fc-hit:focus-visible{outline:2px solid #F2C58F;outline-offset:2px}

/* ===== Views ===== */
main{padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:18px calc(40px + var(--safe-b));max-width:620px;margin:0 auto}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.vt{font-family:var(--f-display);font-size:21px;color:var(--coffee);margin:0 0 4px;text-wrap:balance}
.vsub{font-size:13px;color:var(--ink-soft);margin:0 0 16px}

/* Itinerary */
.day-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.day-num{flex:none;width:58px;height:58px;border-radius:18px;background:var(--coffee);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.day-num small{font-size:10px;letter-spacing:.14em;opacity:.8}
.day-num b{font-family:var(--f-display);font-size:24px}
.day-meta{min-width:0}
.day-date{font-size:12.5px;color:var(--caramel);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.day-title{font-family:var(--f-display);font-size:21px;margin:2px 0 0;line-height:1.35;color:var(--coffee);text-wrap:balance}
.route{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.meal{background:var(--foam);border-radius:14px;padding:8px 10px;min-width:0}
.meal span{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--milk);font-weight:700}
.meal p{margin:0;font-size:12.5px;line-height:1.4;color:var(--coffee)}
.official{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px}
.official summary{list-style:none;cursor:pointer;padding:12px 15px;font-size:13.5px;font-weight:700;color:var(--coffee);display:flex;align-items:center;gap:8px;min-height:44px}
.official summary::-webkit-details-marker{display:none}
.official summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--milk);border-bottom:2px solid var(--milk);transform:rotate(45deg);transition:transform .2s}
.official[open] summary::after{transform:rotate(-135deg)}
.official summary svg{width:17px;height:17px;color:var(--caramel)}
.official .ob{padding:0 15px 14px;font-size:13.5px;color:var(--ink)}
.official .ob p{margin:0 0 8px}
.official .ob .tip{font-size:12.5px;color:var(--ink-soft);background:var(--foam);border-radius:10px;padding:8px 10px}

.tl{display:flex;flex-direction:column}
.leg{display:flex;align-items:center;padding:8px 0 8px 18px;position:relative;font-size:12px;color:var(--ink-soft)}
.leg::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:2px dashed var(--line)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.pill svg{width:14px;height:14px;flex:none;color:var(--milk)}
.card{width:100%;text-align:left;border:0;padding:0;cursor:pointer;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:block;transition:transform .2s, box-shadow .2s}
.card:active{transform:scale(.985)}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(92,64,51,.16)}}
.ph{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--foam),var(--line));max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:20px;background:rgba(253,251,247,.92);color:var(--coffee)}
.tag.food{background:var(--caramel);color:#fff}
.tag.stay{background:var(--coffee);color:var(--cream)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 7px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(30,18,10,.65));display:flex;align-items:center;gap:4px}
.cap svg{width:12px;height:12px;flex:none}
.credit{font-size:11px;color:var(--ink-soft);margin-top:6px}
.time{position:absolute;right:12px;top:12px;font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(59,42,32,.72);color:var(--cream)}
.cb{padding:13px 16px 15px}
.cb h3{margin:0;font-family:var(--f-display);font-size:17px;line-height:1.4;color:var(--coffee)}
.jp{font-size:12px;color:var(--ink-soft);margin-top:1px}
.cb p{margin:6px 0 0;font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:8px;font-size:12px;color:var(--caramel);font-weight:700;display:flex;align-items:center;gap:4px}
.card.mini{display:flex;align-items:center;gap:12px;padding:12px 14px}
.card.mini .ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--coffee);color:var(--cream);display:grid;place-items:center}
.card.mini .ico svg{width:22px;height:22px}
.card.mini .cb{padding:0;min-width:0}
.card.mini h3{font-size:15.5px}
.card.mini p{-webkit-line-clamp:1;margin-top:2px;font-size:12.5px;color:var(--ink-soft)}
.to-food{margin-top:18px;width:100%;border:1.5px dashed var(--milk);background:transparent;border-radius:18px;min-height:52px;cursor:pointer;color:var(--coffee);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.to-food svg{width:18px;height:18px;color:var(--caramel)}
.day-nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.day-nav button{flex:1;border:0;background:var(--foam);color:var(--coffee);border-radius:14px;min-height:46px;cursor:pointer;font-weight:700;font-size:13.5px}
.day-nav button:disabled{opacity:.35;cursor:default}

/* Food */
.fgrid{display:grid;gap:16px}
@media (min-width:640px){.fgrid{grid-template-columns:1fr 1fr}}
.fc{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.fc-hit{border:0;padding:0;background:none;text-align:left;cursor:pointer;display:block;width:100%}
.fc .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.bdg{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--foam);color:var(--coffee)}
.bdg.own{background:var(--caramel);color:#fff}
.fc .cb{padding:13px 16px 4px}
.fc .why{margin:8px 0 0;font-size:13.5px;line-height:1.6}
.fc .why b{color:var(--caramel)}
.fc ul{margin:8px 0 0;padding-left:1.1em;font-size:13px;color:var(--ink-soft);display:grid;gap:3px}
.fc .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 16px;margin-top:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border-radius:14px;text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.03em;border:0;cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--caramel);color:#fff;box-shadow:0 6px 16px rgba(200,130,60,.3)}
.btn.sec{background:var(--foam);color:var(--coffee)}
.btn.full{width:100%;margin-top:16px;min-height:52px;font-size:15.5px}

.fgroup{margin-bottom:26px}
.fg-h{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.fg-d{flex:none;background:var(--coffee);color:var(--cream);font-family:var(--f-display);font-weight:700;font-size:14px;border-radius:12px;padding:6px 11px}
.fg-h b{display:block;font-family:var(--f-display);font-size:17px;color:var(--coffee);line-height:1.3}
.fg-h small{font-size:12px;color:var(--ink-soft)}
.fc .acts{grid-template-columns:1fr 1fr 1.15fr;padding:12px 16px 4px}
.btn.soc{background:var(--foam);color:var(--coffee)}
.btn.soc svg{color:var(--caramel)}
.extra{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px 14px}
.lnk{border:0;background:none;padding:6px 0;font-size:12.5px;color:var(--caramel);font-weight:700;text-decoration:none;cursor:pointer;min-height:32px}
.warn{display:flex;gap:7px;align-items:flex-start;background:#FBE9DA;color:#8A4A1C;border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.5;margin-top:8px}
.warn svg{width:16px;height:16px;flex:none;margin-top:2px}
.loc{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.loc svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--milk)}
.gm{background:var(--foam);border-radius:18px;padding:13px 15px;font-size:13px;display:grid;gap:4px;color:var(--coffee)}
.gm b{font-size:13px;color:var(--milk);letter-spacing:.04em}
/* Info */
.isec{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:14px}
.isec h3{font-family:var(--f-display);font-size:17px;color:var(--coffee);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.isec h3 svg{width:20px;height:20px;color:var(--caramel)}
.flights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flight{background:var(--foam);border-radius:16px;padding:11px 12px;min-width:0}
.flight .lbl{font-size:11px;letter-spacing:.08em;color:var(--milk);font-weight:700}
.flight .no{font-family:var(--f-display);font-size:17px;font-weight:700;color:var(--coffee)}
.flight .t{font-size:13px;font-variant-numeric:tabular-nums;line-height:1.5}
.flight .dur{font-size:11.5px;color:var(--ink-soft)}
.hotel{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hotel:first-of-type{border-top:0;padding-top:2px}
.hn{background:var(--coffee);color:var(--cream);border-radius:14px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.hn small{font-size:10px;opacity:.8}
.hn b{font-family:var(--f-display);font-size:15px}
.hotel h4{margin:0;font-size:15px;color:var(--coffee)}
.hotel .en{font-size:12px;color:var(--ink-soft)}
.hotel .addr{font-size:13px;margin-top:4px}
.hlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hlinks a,.hlinks button{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 12px;border-radius:12px;background:var(--foam);color:var(--coffee);font-size:13px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-variant-numeric:tabular-nums}
.hlinks svg{width:15px;height:15px;color:var(--caramel)}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:13.5px}
dl.kv dt{color:var(--milk);font-weight:700;white-space:nowrap}
dl.kv dd{margin:0;min-width:0}
.alert{background:#FBEFE3;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--coffee);margin-top:10px}
.foot{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);background:var(--coffee);color:var(--cream);padding:10px 18px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Modal ===== */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(40,25,15,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:calc(100dvh - var(--safe-t) - 24px);background:var(--cream);border-radius:26px 26px 0 0;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;max-width:620px;margin:0 auto;box-shadow:0 -10px 40px rgba(40,25,15,.25)}
.sheet.open{transform:none}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:26px;transform:translateY(-40%) scale(.96);opacity:0;transition:transform .3s,opacity .3s;max-height:88vh}.sheet.open{transform:translateY(-50%);opacity:1}}
.sheet-scroll{overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(20px + var(--safe-b))}
.hero{position:relative;aspect-ratio:16/9;background:var(--foam)}
.hero img{width:100%;height:100%;object-fit:cover}
.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:3px;background:rgba(253,251,247,.85)}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(253,251,247,.92);color:var(--coffee);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.close svg{width:18px;height:18px}
.sh-body{padding:16px max(20px, env(safe-area-inset-right,0px)) 0 max(20px, env(safe-area-inset-left,0px))}
.sh-kicker{font-size:12px;color:var(--caramel);font-weight:700;letter-spacing:.08em}
.sh-title{font-family:var(--f-display);font-size:22px;margin:2px 0 0;color:var(--coffee);line-height:1.35;text-wrap:balance}
.sh-desc{font-size:14px;margin:10px 0 0}
.blk{margin-top:14px;background:var(--card);border-radius:18px;padding:13px 15px;box-shadow:0 1px 3px rgba(92,64,51,.08)}
.blk h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;color:var(--milk);display:flex;align-items:center;gap:7px}
.blk h4 svg{width:17px;height:17px;color:var(--caramel)}
.blk li{font-size:14px}
.blk ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.blk.drive{background:var(--coffee);color:var(--cream)}
.blk.drive h4{color:rgba(253,251,247,.75)}
.drive-route{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.5}
.drive-route em{font-style:normal;color:#F2C58F}
.drive-note{font-size:12px;opacity:.75;margin-top:4px}
body.lock{overflow:hidden}
</style>
</head>
<body>

<header class="hdr" id="hdr"><div class="hdr-in">
  <div class="hdr-top">
    <h1 class="hdr-title">輕遊福熊・九州五日</h1>
    <span class="hdr-sub">2026.11.10 – 11.14</span>
  </div>
  <nav class="main-tabs" role="tablist" aria-label="主要分頁">
    <button class="mt" role="tab" id="mt-itinerary" data-view="itinerary" aria-controls="v-itinerary"></button>
    <button class="mt" role="tab" id="mt-food" data-view="food" aria-controls="v-food"></button>
    <button class="mt" role="tab" id="mt-info" data-view="info" aria-controls="v-info"></button>
  </nav>
  <div class="sub">
    <div class="days" id="dayTabs" role="tablist" aria-label="選擇天數"></div>
    <div class="chips" id="foodChips" role="group" aria-label="依天數篩選美食" hidden></div>
    <div class="sub-note" id="infoNote" hidden>航班・飯店・行李・電壓・緊急聯絡</div>
  </div>
</div></header>

<main>
  <section class="view" id="v-itinerary" role="tabpanel" aria-labelledby="mt-itinerary"></section>
  <section class="view" id="v-food" role="tabpanel" aria-labelledby="mt-food" hidden>
    <h2 class="vt">美食特搜</h2>
    <p class="vsub" id="foodSub"></p>
    <div class="fgrid" id="foodGrid"></div>
  </section>
  <section class="view" id="v-info" role="tabpanel" aria-labelledby="mt-info" hidden></section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" aria-hidden="true">
  <div class="sheet-scroll" id="sheetScroll">
    <div class="hero"><img id="shImg" alt=""><span class="grab"></span>
      <button class="close" id="shClose" aria-label="關閉"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>
</div>

      <dt>領隊</dt><dd>金妮，電話與 LINE 群組請見旅行社手冊</dd>
      <dt>防詐</dt><dd>165 反詐騙專線；旅行社不會以任何名義要求個人帳號資訊</dd>
      <dt>保險</dt><dd>旅行業責任險 500 萬＋意外醫療 20 萬（實支實付），可自行加保旅平險</dd></dl>
    <p class="foot">車程皆為遊覽車／一般路況預估，實際依當日交通與領隊安排為準。景點照片已核對拍攝地點，來源為 Unsplash 與 Wikimedia Commons（作者與授權標示在各景點的詳細頁）；美食照片為料理示意圖。</p>
  </div>`;
}

/* ============ routing ============ */
const hdr = $('#hdr');
const setH = () => document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
new ResizeObserver(setH).observe(hdr);
function show(view, opts={}){
  state.view = view;
  document.querySelectorAll('.mt').forEach(b => b.setAttribute('aria-selected', b.dataset.view===view));
  ['itinerary','food','info'].forEach(v => $('#v-'+v).hidden = v!==view);
  $('#dayTabs').hidden = view!=='itinerary'; $('#foodChips').hidden = view!=='food'; $('#infoNote').hidden = view!=='info';
  if (view==='itinerary'){ document.querySelectorAll('.dt').forEach(b => b.setAttribute('aria-selected', +b.dataset.d===state.day)); renderDay(); }
  if (view==='food'){ document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', +b.dataset.fd===state.foodDay)); renderFood(); }
  if (view==='info' && !$('#v-info').innerHTML) renderInfo();
  setH();
  if (!opts.keepScroll) scrollTo({top:0});
  const hash = view==='itinerary' ? 'day-'+state.day : view;
  try{ if (location.hash !== '#'+hash) history.replaceState(null,'','#'+hash); }catch(e){}
}
document.querySelectorAll('.mt').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));
$('#dayTabs').addEventListener('click', e => { const b = e.target.closest('.dt'); if (b){ state.day = +b.dataset.d; show('itinerary'); } });
$('#foodChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b){ state.foodDay = +b.dataset.fd; show('food'); } });
document.querySelector('main').addEventListener('click', e => {
  const s = e.target.closest('[data-step]'); if (s){ state.day = Math.min(5, Math.max(1, state.day + +s.dataset.step)); show('itinerary'); return; }
  const g = e.target.closest('[data-goto-food]'); if (g){ state.foodDay = +g.dataset.gotoFood; show('food'); return; }
  const c = e.target.closest('[data-copy]'); if (c){ copy(c.dataset.copy); return; }
  const f = e.target.closest('[data-f]'); if (f){ openFood(+f.dataset.f); return; }
  const o = e.target.closest('[data-i]'); if (o) openItem(+o.dataset.i);
});
function copy(text){
  const ok = () => toast('已複製：' + text);
  try { navigator.clipboard.writeText(text).then(ok, () => fallback()); } catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok();}catch(_){} ta.remove(); }
}
/* swipe between days */
let sx=null, sy0=null;
$('#v-itinerary').addEventListener('touchstart', e => { sx=e.touches[0].clientX; sy0=e.touches[0].clientY; }, {passive:true});
$('#v-itinerary').addEventListener('touchend', e => { if (sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy0; sx=null;
  if (Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){ const n = state.day + (dx<0?1:-1); if (n>=1 && n<=5){ state.day=n; show('itinerary'); } } });

/* initial view from hash */
(() => { const h = location.hash.slice(1); const m = h.match(/^day-([1-5])$/);
  if (m){ state.day = +m[1]; show('itinerary', {keepScroll:true}); }
  else if (h==='food' || h==='info') show(h, {keepScroll:true});
  else show('itinerary', {keepScroll:true}); })();

/* ============ modal ============ */
const sheet = $('#sheet'), scrim = $('#scrim'), shImg = $('#shImg'), shBody = $('#shBody');
shImg.onerror = () => { shImg.style.display='none'; };
let lastFocus = null;
const list = arr => (arr||[]).filter(x=>x && x!=='—').map(x=>`<li>${esc(x)}</li>`).join('');
function openItem(i){
  const it = ALL[i], isFood = it.type==='food';
  shImg.style.display = it.img ? '' : 'none';
  if (it.img) shImg.src = U(it.img,1200);
  shImg.alt = it.cap || it.name;
  shBody.innerHTML = `
    <div class="sh-kicker">DAY ${it.day.d} ・ ${it.day.md}（${it.day.wk}）・ ${TAG[it.type]}</div>
    <h3 class="sh-title" id="shTitle">${esc(it.name)}</h3><div class="jp">${esc(it.jp)}</div>${it.cap?`<div class="credit">照片：${esc(it.cap)}${it.credit?'｜'+esc(it.credit):''}</div>`:''}
    <p class="sh-desc">${esc(it.desc)}</p>
    <div class="blk drive"><h4>${ICON[it.leg.m]}交通預估</h4>
      <div class="drive-route">${esc(it.drive.r[0])} ➔ ${esc(it.drive.r[1])}，<em>${esc(it.drive.t)}</em></div>
      ${it.drive.n?`<div class="drive-note">${esc(it.drive.n)}</div>`:''}</div>
    ${list(it.photo)?`<div class="blk"><h4>${ICON.cam}必拍角度／私房視角</h4><ul>${list(it.photo)}</ul></div>`:''}
    <div class="blk"><h4>${ICON[isFood?'bowl':'star']}${isFood?'必吃特色解析':'網路推薦重點'}</h4><ul>${list(it.blog)}</ul></div>
    ${it.q?`<a class="btn pri full" href="${isFood?searchUrl(it.q):navUrl(it.q)}" target="_blank" rel="noopener">${ICON.map}用 Google Maps ${isFood?'搜尋導航':'導航'}</a>`:''}`;
  openSheet();
}
function openSheet(){
  $('#sheetScroll').scrollTop = 0;
  lastFocus = document.activeElement;
  sheet.classList.add('open'); scrim.classList.add('open'); sheet.setAttribute('aria-hidden','false'); document.body.classList.add('lock');
  setTimeout(()=>$('#shClose').focus({preventScroll:true}), 50);
}
function closeSheet(){
  sheet.classList.remove('open'); scrim.classList.remove('open'); sheet.setAttribute('aria-hidden','true');
  document.body.classList.remove('lock'); lastFocus && lastFocus.focus({preventScroll:true});
}
scrim.addEventListener('click', closeSheet); $('#shClose').addEventListener('click', closeSheet);
addEventListener('keydown', e => { if (e.key==='Escape' && sheet.classList.contains('open')) closeSheet(); });
let ty=null;
sheet.addEventListener('touchstart', e => { if ($('#sheetScroll').scrollTop<=0) ty = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchmove', e => { if (ty===null) return; const dy = e.touches[0].clientY - ty; if (dy>0) sheet.style.transform = `translateY(${dy}px)`; }, {passive:true});
sheet.addEventListener('touchend', e => { if (ty===null) return; const dy = e.changedTouches[0].clientY - ty; sheet.style.transform=''; ty=null; if (dy>110) closeSheet(); });
</script>
</body>
</html>
