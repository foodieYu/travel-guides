<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C4033">
<title>Yu 的旅行手冊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
:root{--milk:#B08E6B;--cream:#FDFBF7;--coffee:#5C4033;--caramel:#C8823C;--foam:#F3EADF;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--coffee)}
body{margin:0;background:var(--cream);color:#3B2A20;font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
header{background:var(--coffee);color:var(--cream);padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 26px max(20px,env(safe-area-inset-left,0px))}
header h1{font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;margin:0;font-size:24px;letter-spacing:.04em}
header p{margin:4px 0 0;opacity:.75;font-size:13px}
main{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
a.trip{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 20px rgba(92,64,51,.1)}
.d{flex:none;width:62px;height:62px;border-radius:18px;background:var(--milk);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Zen Maru Gothic",sans-serif;line-height:1.1}
.d small{font-size:11px;opacity:.85}.d b{font-size:20px}
h2{margin:0;font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-size:17px;color:var(--coffee)}
.m{font-size:12.5px;color:#7A6555}
.go{margin-left:auto;color:var(--caramel);font-weight:700}
</style>
</head>
<body>
<header><h1>Yu 的旅行手冊</h1><p>每一趟旅行，一本口袋手冊</p></header>
<main>
  <a class="trip" href="kyushu-2026/">
    <div class="d"><small>2026</small><b>11月</b></div>
    <div><h2>輕遊福熊・九州五日</h2><div class="m">11/10–11/14｜熊本・高千穗・湯布院・福岡・柳川</div></div>
    <span class="go">›</span>
  </a>
</main>
</body>
</html>
